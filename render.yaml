services:
  - type: web
    name: lab-01-node-express-nithin
    env: node
    plan: free
    rootDir: lab-01
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: lab-02-sqlite-crud-nithin
    env: node
    plan: free
    rootDir: lab-02
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
